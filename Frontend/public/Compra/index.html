<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - Prestige Barbers</title>
    <link rel="stylesheet" href="C-styles/styles.css">
    <link rel="stylesheet" href="C-styles/modal-compra.css">
    <link rel="stylesheet" href="C-styles/carrito-modal.css">
    <link rel="stylesheet" href="../I-style/auth-modal.css">
    <link rel="stylesheet" href="../I-style/custom-modal.css">
    <link rel="stylesheet" href="../I-style/search-modal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        /* Prevenir parpadeo inicial - Ocultar contenido hasta que cargue */
        .compra-cont {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        .compra-cont.loaded {
            opacity: 1;
        }
        /* Loader centrado */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            background: #fff;
            z-index: 9999;
        }
        .loader-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1b1b1b;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader.hidden {
            display: none;
        }
        .loader p {
            color: #1b1b1b;
            font-weight: 500;
            font-size: 1rem;
            margin: 0;
        }
        /* ===== RESPONSIVE MÓVIL ===== */
        @media (max-width: 600px) {
            .hamburger-btn { display: flex !important; }
            .head-logo-cont { padding: 12px 16px; }
            .head-logo-cont h1 { font-size: 1rem; padding: 0 50px; text-align: center; width: 100%; }
            .head-icons-cont { right: 14px !important; gap: 8px !important; }
            .head-icons-cont .icon-link { width: 20px !important; height: 20px !important; }
            .head-lkn-cont {
                display: none;
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                padding: 0;
                border-bottom: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #fff;
                z-index: 1050;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
                border-top: 4px solid #1b1b1b;
            }
            .head-lkn-cont.nav-open { display: flex !important; }
            .head-lkn-cont .search-container { display: none !important; }
            .head-lkn-cont a { width: 100%; padding: 16px 24px; border-bottom: 1px solid #e8e8e8; font-size: 1rem; }
            .compra-cont { flex-direction: column; }
            .img-prod-cont {
                position: static !important;
                width: 100% !important;
                height: 65vw !important;
                max-height: 320px !important;
                padding: 20px !important;
                background: #f8f8f8 !important;
                border-bottom: 3px solid #1b1b1b !important;
            }
            .info-prod-cont {
                width: 100% !important;
                margin-left: 0 !important;
                padding: 24px 20px !important;
                min-height: unset !important;
            }
            .info-prod-cont h2 { font-size: 2rem; }
            .lkns-compra-cont a:nth-child(1),
            .lkns-compra-cont a:nth-child(2) { width: 100%; text-align: center; padding: 16px 20px; font-size: 1em; }
            .lkns-compra-cont a:nth-child(3) { padding: 14px 20px; font-size: 0.9em; }
        }
    </style>
</head>
<header>
    <div class="head-logo-cont">
        <a href="../index.html" style="text-decoration: none; color: inherit;">
            <h1>Prestige Barbers</h1>
        </a>
        <div class="head-icons-cont">
            <a href="javascript:void(0)" class="icon-link" id="carritoIcon" title="Carrito" style="position: relative;">
                <img src="../Icons/cart.svg" alt="Carrito">
                <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
            </a>
            <a href="javascript:void(0)" class="icon-link" id="searchIcon" title="Buscar">
                <img src="../Icons/search.svg" alt="Buscar">
            </a>
            <a href="javascript:void(0)" class="icon-link" id="userIcon" title="Usuario">
                <img src="../Icons/user.svg" alt="Usuario">
            </a>
        </div>
    </div>
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menú">
        <span></span><span></span><span></span>
    </button>
    <div class="head-lkn-cont" id="navMenu">
        <a href="../Tienda/index.html">Shop</a>
        <a href="../Cortes/index.html">Servicios</a>
        <a href="../Barberos/index.html">Barberos</a>
        <a href="../AcercaDe/index.html">Acerca De</a>
        
        <!-- Contenedor de búsqueda elegante -->
        <div class="search-container">
            <input 
                type="search" 
                class="search-input" 
                placeholder="¿Qué buscas?" 
                autocomplete="new-password"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                name="search-query-prestige"
                role="searchbox"
                aria-label="Búsqueda de productos y servicios"
                data-form-type="other"
                disabled>
            <button class="search-close">&times;</button>
        </div>
    </div>
    
    <!-- Resultados de búsqueda -->
    <div class="search-results"></div>
</header>
<main>
    <!-- Loader mientras carga (centrado en pantalla completa) -->
    <div class="loader" id="pageLoader">
        <div class="loader-spinner"></div>
        <p>Cargando producto...</p>
    </div>

    <!-- Contenedor principal (oculto inicialmente) -->
    <div class="compra-cont" id="mainContent">
        <div class="img-prod-cont">
            <img id="productImage" src="" alt="" style="display: none;">
        </div>
        <div class="info-prod-cont">
            <label id="productBrand"></label>
            <h2 id="productName"></h2>
            <div class="description-container">
                <p id="productDescription" class="collapsed"></p>
                <div class="description-fade"></div>
                <button class="ver-mas-btn" id="verMasBtn">Ver más</button>
            </div>

            <!-- Detalles del producto -->
            <div class="product-details">
                <div class="detail-item">
                    <label class="detail-label">Tamaño</label>
                    <span class="detail-value" id="productSize"></span>
                </div>
                <div class="detail-item">
                    <label class="detail-label">Categoría</label>
                    <span class="detail-value" id="productCategory"></span>
                </div>
                <div class="detail-item">
                    <label class="detail-label">Tipo</label>
                    <span class="detail-value" id="productType"></span>
                </div>
            </div>

            <!-- Precio -->
            <div class="price-container">
                <label class="price-label">Precio</label>
                <h3 class="price-value" id="productPrice"></h3>
            </div>

            <div class="lkns-compra-cont">
                <a href="#" id="buyButton">Comprar Ahora</a>
                <a href="#" id="addToCartButton">Agregar al Carrito</a>
                <a href="../index.html#contacto">Contáctenos</a>
            </div>
        </div>
    </div>
</main>

<!-- Modal de autenticación (Estructura estandarizada) -->
<div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal-content">
        <button class="auth-modal-close" id="closeModalBtn">&times;</button>

        <!-- Formulario de Login -->
        <div class="log-cont" id="loginForm">
            <label for="">Iniciar Sesión</label>
            <label for="">Correo Electrónico</label>
            <input type="email" id="login-email" required>
            <label for="">Contraseña</label>
            <input type="password" id="login-password" required>
            <button type="submit">Iniciar Sesión</button>
            <div class="reg-cont">
                <label>¿No tienes una cuenta?</label>
                <button type="button" id="showRegister">Regístrate</button>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="log-cont" id="registerForm" style="display: none;">
            <label for="">Registro</label>
            <label for="">Nombre Completo</label>
            <input type="text" id="register-name" required>
            <label for="">Correo Electrónico</label>
            <input type="email" id="register-email" required>
            <label for="">Contraseña</label>
            <input type="password" id="register-password" required>
            <label for="">Confirmar Contraseña</label>
            <input type="password" id="register-confirm" required>
            <button type="submit">Registrarse</button>
            <div class="reg-cont">
                <label>¿Ya tienes una cuenta?</label>
                <button type="button" id="showLogin">Iniciar Sesión</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal de compra realizada -->
<div class="compra-modal-overlay" id="compraModal">
    <div class="compra-modal-content">
        <button class="compra-modal-close" id="closeCompraModalBtn">&times;</button>
        <div class="compra-success">
            <div class="success-icon"><svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 25L20 35L40 15" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <h2>Compra Realizada</h2>
            <p>Tu compra ha sido procesada exitosamente.</p>
            <button class="continue-btn" id="continueBtn">Continuar</button>
        </div>
    </div>
</div>

<!-- Modal del Carrito -->
<div class="carrito-modal-overlay" id="carritoModal">
    <div class="carrito-modal-content">
        <div class="carrito-modal-header">
            <h2>Tu Carrito</h2>
            <p class="carrito-count"><span id="carritoCount">0</span> productos</p>
            <button class="carrito-modal-close" id="closeCarritoBtn">&times;</button>
        </div>

            <div class="carrito-items-list" id="carritoItemsList">
                <!-- Los items se cargarán dinámicamente aquí -->
                <div class="carrito-empty" id="carritoEmpty">
                <div class="carrito-empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="9" cy="21" r="1"/>
                        <circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                </div>
                <p>Tu carrito está vacío</p>
            </div>
            </div>        <div class="carrito-modal-footer" id="carritoFooter" style="display: none;">
            <div class="carrito-total-section">
                <span class="carrito-total-label">Total:</span>
                <span class="carrito-total-precio" id="carritoTotal">$0</span>
            </div>
            <button class="carrito-btn-comprar" id="carritoComprarBtn">Comprar</button>
        </div>
    </div>
</div>

<body>
    <script src="../js/custom-modal.js"></script>
    <script src="../js/carrito.js"></script>
    <script src="C-Js/Compra.js"></script>
    <script src="../js/sticky-header.js"></script>
    <script src="../js/auth-modal.js"></script>
    <script>
        // Configurar el modal de compra exitosa
        document.addEventListener('DOMContentLoaded', () => {
            const compraModal = document.getElementById('compraModal');
            const closeCompraModalBtn = document.getElementById('closeCompraModalBtn');
            const continueBtn = document.getElementById('continueBtn');

            if (closeCompraModalBtn) {
                closeCompraModalBtn.addEventListener('click', () => {
                    if (compraModal) {
                        compraModal.style.display = 'none';
                    }
                });
            }

            if (continueBtn) {
                continueBtn.addEventListener('click', () => {
                    if (compraModal) {
                        compraModal.style.display = 'none';
                    }
                });
            }

            // Cerrar al hacer clic fuera
            if (compraModal) {
                compraModal.addEventListener('click', (e) => {
                    if (e.target === compraModal) {
                        compraModal.style.display = 'none';
                    }
                });
            }
        });
    </script>
    <script src="../js/search-modal.js"></script>
    <script src="../js/hamburger.js"></script>
</body>

</html>
